version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/api.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models  # Mount models for persistence
      - ./logs:/app/logs
    environment:
      - MLFLOW_TRACKING_URI=file:///app/mlruns

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:5000  # Pass API URL to Next.js
    depends_on:
      - api