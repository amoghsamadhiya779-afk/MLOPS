name: Voyage Analytics MLOps Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # pip install pytest  # Uncomment when you add unit tests

    - name: Run Code Linting (Flake8)
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # - name: Run Unit Tests
    #   run: |
    #     pytest tests/

    - name: Build API Docker Image
      run: |
        docker build -t voyage-api:latest -f deployment/docker/api.Dockerfile .

    - name: Build UI Docker Image
      run: |
        docker build -t voyage-ui:latest -f deployment/docker/ui.Dockerfile .

    - name: Build Airflow Docker Image
      run: |
        docker build -t voyage-airflow:latest -f deployment/docker/airflow.Dockerfile .

    - name: Pipeline Success
      run: echo "🚀 Code tested and Docker images built successfully!"